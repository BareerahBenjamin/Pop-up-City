<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢迎来到 Pop-up City · 动画预览</title>
<style>
@import url('/tokens.css');
*{box-sizing:border-box}body{margin:0;background:#fff8fa;color:#76314f;font-family:var(--font-body);min-height:100svh}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}a{color:inherit}header{position:absolute;inset:0 0 auto;z-index:5;padding:28px 4vw;display:flex;align-items:center;justify-content:space-between}header img{width:145px;height:auto}header span{font-size:10px;letter-spacing:2px}.scene{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:100px 20px 85px;background:radial-gradient(ellipse at 50% 37%,#f9dce7 0,transparent 49%)}.scene:before{content:"";position:absolute;inset:0;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23885d68' opacity='.18' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");pointer-events:none}.art{width:min(560px,85vw);height:310px;position:relative;margin-bottom:18px}.orbit{position:absolute;inset:15% -9%;border:1px solid #d794b0;border-radius:50%;transform:rotate(-16deg);animation:orbit-in 1.7s .1s both}.orbit.two{inset:2% 17%;transform:rotate(38deg);border-color:#d794b066;animation-delay:.25s}.orbit:after{content:"";width:9px;height:9px;background:#d4387c;position:absolute;left:12%;top:12%;border-radius:50%;box-shadow:0 0 0 7px #d4387c0b}.platform{position:absolute;bottom:6px;left:12%;width:76%;height:60px;border-radius:50%;background:#e6acc453;filter:blur(18px);animation:appear 1.8s both}.object{position:absolute;object-fit:contain;filter:drop-shadow(0 16px 17px #9d40641a)}.computer{width:220px;height:240px;left:calc(50% - 110px);top:25px;animation:pop 1.3s .4s both,float 6s 1.7s ease-in-out infinite}.vase{width:135px;height:180px;left:0;bottom:0;transform:rotate(-12deg);animation:pop-left 1.2s .7s both,float 7s 1.9s ease-in-out infinite}.heart{width:135px;height:135px;right:2%;top:0;animation:pop 1.2s .9s both,float 5s 2.1s ease-in-out infinite}.spark{position:absolute;color:#c53773;font-family:serif;font-size:32px;animation:pop 1s 1.25s both,twinkle 4s 2.25s infinite}.s1{left:20%;top:0}.s2{right:14%;bottom:24px;font-size:23px}.tag{position:absolute;font-size:10px;letter-spacing:2px;right:-3%;top:47%;transform:rotate(90deg);animation:appear 1s 1.3s both}.copy{text-align:center;position:relative}.eyebrow{font-size:10px;letter-spacing:4px;margin:0 0 18px;animation:rise .9s 1.1s both}h1{font-family:var(--font-display);font-weight:400;font-size:clamp(36px,5.5vw,64px);letter-spacing:3px;line-height:1.3;margin:0;animation:rise 1.1s 1.3s both}h1 em{font-style:normal;color:#c52e70}.subtitle{font-size:13px;line-height:2;letter-spacing:2px;margin:20px 0 27px;color:#95647a;animation:rise 1s 1.55s both}.enter{display:inline-flex;align-items:center;gap:50px;background:#a72e63;color:#fff7fb;border:1px solid #a72e63;border-radius:40px;padding:16px 26px;text-decoration:none;font-size:13px;letter-spacing:2px;animation:rise 1s 1.8s both;transition:background .2s,transform .2s}.enter:hover{background:#85204d;transform:translateY(-3px)}.enter span{font-size:19px;line-height:1}.note{font-size:10px;letter-spacing:2px;margin-top:19px;color:#aa7e90;animation:appear 1.3s 2.1s both}footer{position:absolute;bottom:24px;left:4vw;right:4vw;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #dca9bf66;padding-top:17px;font-size:10px;letter-spacing:2px;color:#97647b}footer button{border:0;background:transparent;color:inherit;cursor:pointer;padding:8px;letter-spacing:1px;font-size:11px}button:focus-visible,a:focus-visible{outline:2px solid #a72e63;outline-offset:5px}.edition{position:absolute;left:4vw;top:48%;writing-mode:vertical-rl;font-size:10px;letter-spacing:4px;color:#b68b9f}
@keyframes pop{from{opacity:0;translate:0 60px;scale:.65;rotate:-9deg}to{opacity:1;translate:0 0;scale:1;rotate:0deg}}@keyframes pop-left{from{opacity:0;translate:0 50px;scale:.6;rotate:12deg}to{opacity:1;translate:0 0;scale:1;rotate:0deg}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}@keyframes orbit-in{from{opacity:0;scale:.5;rotate:-30deg}to{opacity:1;scale:1;rotate:0deg}}@keyframes rise{from{opacity:0;translate:0 20px}to{opacity:1;translate:0 0}}@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes twinkle{0%,100%{opacity:1;scale:1}50%{opacity:.4;scale:.8}}
@media(min-height:850px){.art{height:350px;margin-bottom:35px}.computer{top:40px}.vase{bottom:15px}.heart{top:15px}}
@media(max-width:600px){header{padding:24px}header img{width:115px}header span{font-size:8px;letter-spacing:1px}.art{height:260px;width:320px;margin-bottom:25px}.computer{width:175px;height:200px;left:calc(50% - 87px);top:25px}.vase{width:90px;height:135px;left:-2%;bottom:5px}.heart{width:95px;height:100px;right:-1%;top:5px}.tag,.edition{display:none}.scene{padding-top:100px}h1{font-size:37px;letter-spacing:1px}.subtitle{font-size:12px;letter-spacing:1px}footer{left:24px;right:24px;letter-spacing:1px;font-size:8px}.eyebrow{font-size:9px;letter-spacing:3px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
footer{position:relative;bottom:auto;left:auto;right:auto;margin:0 4vw 20px}.scene{min-height:calc(100svh - 62px);padding-bottom:30px}@media(max-width:600px){footer{margin:0 24px 18px}.scene{padding-bottom:25px}}
</style>
</head>
<body>
<header><img src="/assets/series/herstory-logo.png" alt="HERSTORY"><span>POP-UP CITY / 2026</span></header>
<main class="scene" id="scene">
<span class="edition" aria-hidden="true">A CITY MADE OF US</span>
<div class="art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="platform"></div><img class="object computer" src="/assets/series/computer.png" alt=""><img class="object vase" src="/assets/series/vase.png" alt=""><img class="object heart" src="/assets/series/heart.png" alt=""><span class="spark s1">✳</span><span class="spark s2">✦</span><span class="tag">HELLO, NEW NEIGHBOR</span></div>
<div class="copy"><p class="eyebrow">HERSTORY · 科技碰瓷节</p><h1>欢迎来到<br>由<em>我们</em>发生的城市。</h1><p class="subtitle">100 位女性创造者，14 天一起生活。<br>让想法碰面，让故事发生。</p><a class="enter" href="/#events">推门，成为邻居 <span aria-hidden="true">↗</span></a><p class="note">2026.10.19 — 11.01 · 景德镇</p></div>
</main>
<footer><span>学习 / 链接 / 创造 / 玩</span><button type="button" id="replay" aria-label="重播欢迎动画">↻ 重播动画</button><span>一起生活，也一起建造。</span></footer>
<script>document.getElementById('replay').addEventListener('click',()=>{const elements=document.querySelectorAll('.scene, .scene *');elements.forEach(el=>el.style.animation='none');requestAnimationFrame(()=>requestAnimationFrame(()=>elements.forEach(el=>el.style.animation='')))});</script>
</body></html>
