<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C1210"><title>Herstory · 星域</title><!-- HOST_BOOTSTRAP --><!-- STYLE --></head>
<body data-tab="field" data-planet-mode="3d">
<p class="host-growth-note">参加活动并成功签到，让你的星球逐渐成长。</p>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
<symbol id="i-planet" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="11" ry="3.5" transform="rotate(-30 12 12)"/></symbol>
<symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h5l2-3h4l2 3h5v14H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M5 12v9h14v-9"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6ZM14 3v5h5M9 12h7M9 16h7"/></symbol></defs></svg>
<div class="app">
<header class="topbar"><div class="location"><span class="status-dot" aria-hidden="true"></span><h1 id="screen-title">星域</h1><span id="resident-count"></span></div><div class="top-meta"><span id="day-label-ui">DAY 00</span></div><div class="planet-display-switch" role="group" aria-label="星球显示方式"><button type="button" data-planet-mode="3d" aria-pressed="true" aria-controls="world">3D 星球</button><button type="button" data-planet-mode="2d" aria-pressed="false" aria-controls="host-pixel-view">2D 像素</button></div></header><button id="report-hint" hidden></button>
<div id="sync-error" hidden role="status"><span>更新失败</span><button id="retry-sync">重试</button></div>
<main>
<section id="space-view" aria-label="星域"><div id="world" aria-label="可旋转缩放的 Herstory 三维星球"></div><div id="host-pixel-view" hidden><canvas id="host-pixel-canvas" width="240" height="320" role="img" aria-label="我的 2D 像素星球"></canvas></div><div id="distant-stars" aria-hidden="true"></div><div id="star-field" aria-label="周围星球"></div><div class="world-tools"><button id="planet-camera" aria-label="相机" aria-haspopup="dialog" aria-controls="planet-card"><svg aria-hidden="true"><use href="#i-camera"/></svg></button><button id="reset" aria-label="恢复全景"><svg><use href="#i-reset"/></svg></button></div><div class="mine-footer"><span id="selected-friend" hidden></span></div><div id="world-error" hidden role="alert">星球加载失败<button id="reload-world">重新加载</button></div></section>
<section id="friends-view" hidden aria-labelledby="friends-heading"><div class="friends-heading"><h2 id="friends-heading">星球好友</h2><span id="friend-count">0</span></div><ul id="friend-list"></ul><div id="friends-empty" hidden><svg><use href="#i-people"/></svg><p>暂无星球好友</p></div></section>

</main>
<nav class="bottom-nav" aria-label="主要导航"><button data-tab="field" aria-current="page"><svg><use href="#i-star"/></svg><span>星域</span></button><button data-tab="mine"><svg><use href="#i-planet"/></svg><span>我的星球</span></button><button data-tab="reports" aria-haspopup="dialog" aria-controls="reports-view"><svg><use href="#i-report"/></svg><span>活动报告</span></button></nav>
</div>
<div hidden aria-hidden="true"><span id="nav-friend-count" hidden></span><button id="capture"></button><button id="rotate"></button><input id="growth" type="range" value="1"><span id="day-label"></span><span id="region-tag"></span><span id="region-title"></span><span id="region-copy"></span><section id="city-controls"><span id="city-location"></span></section></div>
<div id="notice" class="hide" role="status"></div>
<dialog id="reports-view" aria-labelledby="reports-sheet-title"><div class="report-toolbar"><button id="report-back" hidden aria-label="返回"><svg><use href="#i-arrow"/></svg></button><h2 id="reports-sheet-title">活动报告</h2><button id="close-reports" aria-label="关闭活动报告"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="reports-scroll"><div id="report-list"></div><article id="report-reading" hidden></article><section id="report-inspect" hidden></section></div></dialog>
<dialog id="planet-card" aria-label="保存星球预览"><div class="card-toolbar"><div class="card-mode-switch" role="group" aria-label="保存图片类型"><button type="button" data-card-mode="3d" aria-pressed="true" aria-controls="card-preview">3D 星球</button><button type="button" data-card-mode="2d" aria-pressed="false" aria-controls="card-preview">2D 像素</button></div><button id="close-card" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="card-pages" aria-label="星球保存预览"><div id="photo-pane"><div id="card-wait" hidden role="status" aria-label="正在生成卡片"><span class="card-wait-indicator" aria-hidden="true"></span></div><img id="card-preview" alt="星球纪念卡"></div></div><button id="save-card" disabled>保存到相册</button></dialog>
<!-- WORLD -->
<!-- UI -->
</body></html>
