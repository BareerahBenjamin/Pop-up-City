name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install Linux dependencies
        run: npm ci --omit=dev --include=optional --ignore-scripts
      - name: Run isolated regression tests
        run: npm test
      - name: Check deployable release
        run: node scripts/check-release.mjs
